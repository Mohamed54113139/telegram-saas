services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: telegram_saas
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/telegram_saas?schema=public"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-change-me-32-chars-minimum}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000}"
      SCHEDULER_INTERVAL_SECONDS: 30
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:4000}"
    ports:
      - "3000:3000"

volumes:
  pgdata:
